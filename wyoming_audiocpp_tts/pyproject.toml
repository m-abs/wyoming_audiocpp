[project]
name = "wyoming-audiocpp-tts"
version = "0.1.0"
description = "Wyoming protocol TTS service bridging to audio.cpp"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CoRal / Alexandra Institute"},
]
keywords = ["wyoming", "tts", "audio.cpp", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "wyoming>=1.10.2,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/OHF-Voice/wyoming_roester"

[tool.setuptools]
platforms = ["any"]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["wyoming_audiocpp_tts", "wyoming_audiocpp_tts.tests"]
exclude = ["tests", "wyoming_audiocpp_tts.tests.*.tests"]

[project.scripts]
wyoming-audiocpp-tts = "wyoming_audiocpp_tts.__main__:main"

[build-system]
requires = ["setuptools>=78,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
    "pytest-asyncio",
    "requests",
]

# Demo browser web server (--web-server); Flask is only imported on that path,
# so it is optional rather than a hard dependency.
web = [
    "flask>=3.0,<4",
    "werkzeug",
]
