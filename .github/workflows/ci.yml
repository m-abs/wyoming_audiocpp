name: CI

on:
  pull_request:

jobs:
  tests:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Single distribution; dev extra includes the production extras (web,
          # zeroconf) plus test tooling (pytest, pytest-asyncio).
          python -m pip install -e ".[dev]"

      - name: Run tests
        # The happy-path e2e tests in tests/test_e2e_bridges.py require a live
        # audio.cpp service (GPU model backend) and skip when it is unreachable.
        # The broken-upstream e2e tests and all unit tests run without one, so
        # this job is deterministic on the standard runner.
        run: |
          python -m pytest \
            tests \
            wyoming_audiocpp_asr/tests \
            wyoming_audiocpp_tts/tests
