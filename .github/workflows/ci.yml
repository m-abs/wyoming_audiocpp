name: CI

on:
  pull_request:

jobs:
  tests:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ASR distribution (root pyproject.toml); the dev extra pulls in the
          # web + zeroconf extras and the test tooling (pytest, pytest-asyncio).
          python -m pip install -e ".[dev]"
          # TTS distribution; dev extra for test tooling plus the web extra so
          # its Flask demo-server tests run (they skip without flask).
          python -m pip install -e "wyoming_audiocpp_tts/[dev,web]"

      - name: Run tests
        # The happy-path e2e tests in tests/test_e2e_bridges.py require a live
        # audio.cpp service (GPU model backend) and skip when it is unreachable.
        # The broken-upstream e2e tests and all unit tests run without one, so
        # this job is deterministic on the standard runner.
        run: |
          python -m pytest \
            tests \
            wyoming_audiocpp_asr/tests \
            wyoming_audiocpp_tts/tests
