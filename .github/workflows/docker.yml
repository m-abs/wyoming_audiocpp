name: Docker

on:
  push:
    branches:
      - rc
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ASR image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: asr
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/asr:${{ steps.version.outputs.version }}
            ${{ if github.ref == 'refs/heads/main' }}ghcr.io/m-abs/wyoming_audiocpp/asr:latest{{ endif }}

      - name: Build and push TTS image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tts
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/tts:${{ steps.version.outputs.version }}
            ${{ if github.ref == 'refs/heads/main' }}ghcr.io/m-abs/wyoming_audiocpp/tts:latest{{ endif }}
