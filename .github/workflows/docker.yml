name: Docker

on:
  push:
    branches:
      - rc
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.ref }}" = "refs/heads/rc" ]; then
            LAST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://ghcr.io/v2/m-abs/wyoming_audiocpp/asr/tags/list" | \
              jq -r --arg v "${VERSION}" \
              '[(.tags // [])[] | select(startswith("${v}-rc")) | sub("^${v}-rc"; "") | tonumber] | (max // 0)')
            RC_NUM=$((LAST + 1))
            VERSION="${VERSION}-rc${RC_NUM}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ASR image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: asr
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/asr:${{ steps.version.outputs.version }}

      # The `latest` tag is only meaningful on main; GitHub Actions has no
      # if/else inside expressions, so the conditional is a step-level `if:`.
      - name: Tag ASR image as latest (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: asr
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/asr:latest

      - name: Build and push TTS image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tts
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/tts:${{ steps.version.outputs.version }}

      - name: Tag TTS image as latest (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tts
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/tts:latest

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
