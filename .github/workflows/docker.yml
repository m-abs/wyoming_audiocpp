name: Docker

on:
  push:
    branches:
      - rc
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so all git tags are present; the RC number is derived
          # from tags instead of the ghcr registry API.
          fetch-depth: 0

      - name: Read version and check publish eligibility
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          BASE="${VERSION}"
          publish=true
          if [ "${{ github.ref }}" = "refs/heads/rc" ]; then
            # Git tags are created by this workflow only after a successful
            # image push, so they mirror what is on ghcr.io. The registry tags
            # API (ghcr.io/v2/.../tags/list) needs package read access and
            # failed with curl exit 22 (HTTP error) on the rc runs.
            if [ -n "$(git tag -l "${BASE}")" ]; then
              echo "Base version ${BASE} is already released; skipping RC publish."
              publish=false
            else
              LAST=$(git tag -l "${BASE}-rc*" | sed "s/.*-rc//" | sort -n | tail -1)
              RC_NUM=$(( ${LAST:-0} + 1 ))
              VERSION="${BASE}-rc${RC_NUM}"
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ASR image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: asr
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/asr:${{ steps.version.outputs.version }}

      # The `latest` tag is only meaningful on main; GitHub Actions has no
      # if/else inside expressions, so the conditional is a step-level `if:`.
      - name: Tag ASR image as latest (main only)
        if: github.ref == 'refs/heads/main' && steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: asr
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/asr:latest

      - name: Build and push TTS image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tts
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/tts:${{ steps.version.outputs.version }}

      - name: Tag TTS image as latest (main only)
        if: github.ref == 'refs/heads/main' && steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tts
          push: true
          tags: |
            ghcr.io/m-abs/wyoming_audiocpp/tts:latest

      - name: Create git tag
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "$(git tag -l "${VERSION}")" ]; then
            echo "Tag ${VERSION} already exists; not re-tagging."
          else
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi
