services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3-3.14-bookworm
    volumes:
      - ..:/workspaces:cached
      - omp-data:/home/vscode/.omp
      - ${HOME}/.omp/agent:/home/vscode/.omp/agent
      - omp-sessions:/home/vscode/.omp/agent/sessions
    command: sleep infinity

    environment:
      - TZ=Europe/Copenhagen
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHON_AUTO_VRUN=1

    depends_on:
      - audio.cpp
      
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - host
      - audiocpp
    ports:
      - "0.0.0.0:11301:11301"   # ASR (Wyoming)
      - "0.0.0.0:11201:11201"   # TTS (Wyoming)

    working_dir: /workspaces

  audio.cpp:
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./audio.cpp/models:/app/models
      - ./audio.cpp/server.json:/app/server.json
      - ./audio.cpp/cmd.sh:/app/cmd.sh:ro
    entrypoint: /app/cmd.sh

    environment:
      - TZ=Europe/Copenhagen

    networks:
      - audiocpp

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  omp-data:
  omp-sessions:

networks:
  host:
    driver: bridge
  audiocpp:
