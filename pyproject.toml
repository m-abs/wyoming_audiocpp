[project]
name = "wyoming-audiocpp"
version = "0.1.0"
description = "Wyoming protocol Danish voice assistant (ASR + TTS)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CoRal / Alexandra Institute"},
]
keywords = ["rhasspy", "wyoming", "asr", "tts", "danish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "wyoming>=1.10.2,<2",
    # numpy 1.x for Python < 3.13 (no 1.x wheels on 3.13+), numpy 2.x for 3.13+
    "numpy>=1.24.0,<2.0.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/OHF-Voice/wyoming_roester"

[tool.setuptools]
platforms = ["any"]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["wyoming_roester"]
exclude = ["tests", "wyoming_roester.tests"]

[project.scripts]
wyoming-roester = "wyoming_roester.__main__:main"

[build-system]
requires = ["setuptools>=78,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
    "pytest-asyncio",
]
# Optional ASR extras. asr_handler implements its own lean TransformersTranscriber
# on top of `transformers` + `torch`; it does NOT import faster-whisper, so that
# package is intentionally not a dependency here (only torch/transformers are).
# pysilero-vad powers the optional --vad-endpointing feature.
transformers = [
    "pysilero-vad>=3.4.0,<4",
    "transformers[torch]>=4.46,<6",
    "sentencepiece"
]
